[package]
name = "uwlt"
version = "0.1.3"
edition = "2024"
description = "A native wallet for TRON, Ethereum, Polygon and Solana"
rust-version = "1.94.1"
license = "MIT"
repository = "https://github.com/YinMo19/uwlt"

[dependencies]
alloy = { version = "2.5", default-features = false, features = [
    "std",
    "provider-http",
    "rpc-types",
    "signer-local",
    "sol-types",
    "reqwest-rustls-tls",
] }
anyhow = "1"
base64 = "0.22"
bincode = "1.3"
prost = "0.14"
bs58 = { version = "0.5", features = ["check"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
color-print = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Avoid the full SDK's OpenSSL-backed precompiles in the signed macOS app.
solana-compute-budget-interface = "2"
solana-hash = "2"
solana-instruction = "2"
solana-message = { version = "2", features = ["bincode"] }
solana-program-option = "2"
solana-program-pack = "2"
solana-pubkey = { version = "2", features = ["curve25519"] }
solana-sha256-hasher = "2"
solana-signature = "2"
solana-system-interface = { version = "1", features = ["bincode"] }
solana-transaction = { version = "2", features = ["bincode"] }
spl-associated-token-account = "7"
spl-token = "8"
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
solana-signature = { version = "2", features = ["verify"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
strip = "debuginfo"
