[package]
name = "uwlt"
version = "0.1.3"
edition = "2024"
description = "A native wallet for TRON, Ethereum and Polygon"
rust-version = "1.94.1"
license = "MIT"
repository = "https://github.com/YinMo19/uwlt"

[dependencies]
alloy = { version = "2.5", default-features = false, features = [
    "std",
    "provider-http",
    "rpc-types",
    "signer-local",
    "sol-types",
    "reqwest-rustls-tls",
] }
anyhow = "1"
prost = "0.14"
bs58 = { version = "0.5", features = ["check"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
color-print = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
strip = "debuginfo"
